# Template obtained from: https://github.com/ArtemkaKun/v-project-basement/tree/main/.github/ISSUE_TEMPLATE
name: 🐛 Bug Report
description: Report a bug
title: (bug report summary)
labels: Bug
body:
  - type: textarea
    id: description
    attributes:
      label: Describe the bug
      description: What is the problem? A clear and concise description of the bug.
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: What did you expect to happen?
    validations:
      required: true

  - type: textarea
    id: current
    attributes:
      label: Current Behavior
      description: |
        What actually happened?

        Please include full errors, uncaught exceptions, stack traces, and relevant logs.
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction Steps
      description: |
        Provide a self-contained, concise snippet of code that can be used to reproduce the issue.
        For more complex issues provide a repo with the smallest sample that reproduces the bug.

        Avoid including business logic or unrelated code, it makes diagnosis more difficult.
        The code sample should be an SSCCE. See http://sscce.org/ for details.
        In short, please provide a code sample that we can copy/paste, run and reproduce.
    validations:
      required: true

  - type: textarea
    id: file
    attributes:
      label: Sample spreadsheet
      description: |
        If the bug involves reading or writing a specific file, please attach the smallest
        `.xlsx` file that reproduces it, and mention which application produced it
        (Excel, LibreOffice, Google Sheets, this library, etc.).
    validations:
      required: false

  - type: textarea
    id: solution
    attributes:
      label: Possible Solution
      description: Suggest a fix/reason for the bug
    validations:
      required: false

  - type: textarea
    id: context
    attributes:
      label: Additional Information/Context
      description: |
        Anything else that might be relevant for troubleshooting this bug.
        Providing context helps us come up with a solution that is most useful in the real world.
    validations:
      required: false

  - type: input
    id: version
    attributes:
      label: V version
      description: |
        The output of `v version`. This project pins the V commit it builds against in
        `.v-version`; please mention if you are on a different one, since that is a common
        source of build failures.
    validations:
      required: true

  - type: textarea
    id: environment
    attributes:
      label: Environment details (OS name and version, etc.)
      description: You can use `v doctor` to fill up this section.
    validations:
      required: true
