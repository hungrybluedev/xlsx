name: Code Quality

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "0 0 * * 4"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  code-quality:
    name: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu, macos, windows]
    runs-on: ${{ matrix.os }}-latest

    steps:
      # Must precede setup-v, which reads .v-version from the working tree.
      - name: Checkout ${{ github.event.repository.name }}
        uses: actions/checkout@v7

      - name: Setup V (pinned via .v-version)
        uses: vlang/setup-v@v1.7
        with:
          version-file: .v-version

      - name: Report V version
        run: v version

      - name: Install module (Unix)
        if: runner.os != 'Windows'
        run: |
          mkdir -p ~/.vmodules
          ln -s ${{ github.workspace }} ~/.vmodules/xlsx

      - name: Install module (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $vmodulesPath = "$env:USERPROFILE\.vmodules"
          New-Item -ItemType Directory -Force -Path $vmodulesPath | Out-Null
          cmd /c mklink /D "$vmodulesPath\xlsx" "${{ github.workspace }}"

      - name: Check if code is formatted
        run: v fmt -verify .

      - name: Check documentation
        run: v check-md .

      - name: Check README examples are in sync
        run: v run tools/check_readme_sync.v

      - name: Compile README snippets
        run: v should-compile-all examples/snippets/

      - name: Check examples compile
        run: v should-compile-all examples/

      - name: Run tests
        run: v test .

      - name: Run marks example
        run: v run examples/01_marksheet/marks.v

  canary:
    name: V master canary
    runs-on: ubuntu-latest
    continue-on-error: true

    steps:
      - name: Checkout ${{ github.event.repository.name }}
        uses: actions/checkout@v7

      - name: Setup V (latest master)
        uses: vlang/setup-v@v1.7
        with:
          version: master
          check-latest: true

      - name: Report V version
        run: v version

      - name: Install module
        run: |
          mkdir -p ~/.vmodules
          ln -s ${{ github.workspace }} ~/.vmodules/xlsx

      - name: Check if code is formatted
        run: v fmt -verify .

      - name: Check examples compile
        run: v should-compile-all examples/

      - name: Run tests
        run: v test .
